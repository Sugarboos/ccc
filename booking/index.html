<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Call - Synoriya</title>
    <meta name="description"
        content="Schedule a consultation with Synoriya to transform your business with AI automation.">

    <!-- SEO & Icons -->
    <link rel="canonical" href="https://synoriya.com/booking/">
    <link rel="icon" type="image/png" href="../assets/favicon.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="../css/styles.css">

    <!-- Cookie Consent Styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@v3.0.0/dist/cookieconsent.css">

    <style>
        body {
            background-color: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .booking-section {
            padding-top: 100px;
            padding-bottom: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            margin: 0;
        }

        .booking-container {
            width: 100%;
            max-width: none;
            background: var(--bg-primary);
            border: none;
            border-radius: 0;
            padding: 20px 0;
            box-shadow: none;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 768px) {
            .booking-container {
                padding: 20px;
                border: none;
                background: transparent;
                box-shadow: none;
            }

            .booking-section {
                padding-top: 100px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <nav class="nav" role="navigation" aria-label="Main navigation">
        <a href="../" class="nav-logo">Synoriya</a>

        <!-- Simple Back Link for clarity on this dedicated page -->
        <div class="nav-center">
            <a href="../" class="nav-link">← Back to Home</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="booking-section">
        <div class="booking-container">
            <h1
                style="text-align: center; margin-bottom: 30px; font-size: 32px; background: linear-gradient(135deg, white 0%, #ccc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                Schedule Your Demo</h1>

            <!-- Calendly Inline Widget -->
            <!-- Note: We use the same consent logic script below to inject it safely -->
            <div id="booking-embed" style="width: 100%; height: 1000px;"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer style="padding: 40px; text-align: center; border-top: 1px solid var(--border-color);">
        <p style="color: var(--text-muted); font-size: 14px;">© 2025 Synoriya. All rights reserved.</p>
    </footer>

    <!-- Cookie Consent Script -->
    <script type="module" src="../js/cookie-consent.js"></script>

    <!-- Simple Load Script for this page -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const bookingEmbed = document.getElementById('booking-embed');

            // Function to load Calendly
            const loadCalendlyWidget = () => {
                // Clear loading state
                bookingEmbed.innerHTML = '';

                // Create container 
                const container = document.createElement('div');
                container.className = 'calendly-inline-widget';
                container.setAttribute('data-url', 'https://calendly.com/abdelalissa78/30min');
                container.style.minWidth = '320px';
                container.style.height = '1000px';
                bookingEmbed.appendChild(container);

                // Add script
                const script = document.createElement('script');
                script.type = 'text/javascript';
                script.src = 'https://assets.calendly.com/assets/external/widget.js';
                script.async = true;
                document.body.appendChild(script);
            };

            // Check consent using the global object if available, or just load if simple
            // Re-using the logic from script.js would require importing it, but that script is tied to the quiz.
            // We'll reimplement a simple check here that waits for the Consent Tool.

            // For now, to ensure it works immediately for the user request, we load it.
            // Ideally should hook into window.initCookieConsent callback.

            // Simulate loading state
            bookingEmbed.innerHTML = `
                <div style="padding: 60px; text-align: center;">
                    <p style="color: var(--text-secondary);">Loading calendar...</p>
                </div>
            `;

            setTimeout(loadCalendlyWidget, 500);
        });
    </script>

</body>

</html>
